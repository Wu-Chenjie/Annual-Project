name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  python-and-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: next_project

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            next_project/requirements.lock.txt
            next_project/requirements-dev.lock.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.lock.txt

      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ targets
        run: cmake --build cpp/build --config Release --parallel

      - name: Run pytest
        run: python -m pytest -m "not slow" --junitxml=../artifacts/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: artifacts/pytest.xml
          if-no-files-found: ignore
          retention-days: 14
