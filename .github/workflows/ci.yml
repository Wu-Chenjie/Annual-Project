name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r next_project/requirements-dev.lock.txt

      - name: Run pytest
        working-directory: next_project
        run: python -m pytest -m "not slow"

      - name: Configure CMake
        run: cmake -S next_project/cpp -B next_project/cpp/build_ci -DCMAKE_BUILD_TYPE=Release

      - name: Build C++ targets
        run: cmake --build next_project/cpp/build_ci --config Release --parallel
