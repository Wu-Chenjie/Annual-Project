name: Fused 3D Gazebo exploration
on:
  workflow_dispatch:
    inputs:
      record_video:
        description: Record native Gazebo and RViz through Xvfb
        type: boolean
        default: true
jobs:
  exploration:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Build ROS and simulation runtime
        run: docker build -f docker/Dockerfile.ros2 -t annual-swarm:jazzy .
      - name: Package tests
        run: |
          docker run --rm annual-swarm:jazzy bash -c '
            source /opt/ros/jazzy/setup.bash
            cd ros2_ws
            colcon test --packages-select annual_swarm
            colcon test-result --verbose'
      - name: Build recording tools
        if: inputs.record_video
        run: docker build -f docker/Dockerfile.demo -t annual-swarm:demo .
      - name: Real physics acceptance and recording
        if: inputs.record_video
        run: |
          mkdir -p artifacts
          docker run --rm -v "$PWD/artifacts:/workspace/artifacts" annual-swarm:demo bash -c '
            source /opt/ros/jazzy/setup.bash
            source ros2_ws/install/setup.bash
            python3 ros2_ws/src/annual_swarm/scripts/record_decentralized_demo.py --output-dir artifacts/fusion/demo --timeout 7200 --speed 24'
      - name: Headless real physics acceptance
        if: ${{ !inputs.record_video }}
        run: |
          mkdir -p artifacts
          docker run --rm -v "$PWD/artifacts:/workspace/artifacts" annual-swarm:jazzy bash -c '
            source /opt/ros/jazzy/setup.bash
            source ros2_ws/install/setup.bash
            python3 ros2_ws/src/annual_swarm/scripts/decentralized_smoke.py --output-dir artifacts/fusion/demo --timeout 7200'
      - name: Audit lease and flight records
        run: |
          docker run --rm -v "$PWD/artifacts:/workspace/artifacts" annual-swarm:jazzy \
            python3 ros2_ws/src/annual_swarm/scripts/audit_fusion_run.py artifacts/fusion/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fused-3d-gazebo-evidence
          path: |
            artifacts/fusion/demo/**
            !artifacts/fusion/demo/gazebo-rviz-raw.mp4
          retention-days: 14
